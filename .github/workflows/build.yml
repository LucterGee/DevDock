name: Build Electron App

on:
  push:
    tags:
      - 'v*' # 只在推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # 👈 关键修改：如果一个系统挂了，不要取消另一个系统（方便调试）
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # 1. 检出代码 (升级到 v4)
      - name: Check out Git repository
        uses: actions/checkout@v4

      # 2. 安装 Node 环境 (升级到 v4)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2.5 准备内置 nginx 二进制（macOS 从 Homebrew 复制并收集依赖）
      - name: Prepare bundled nginx
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install nginx; fi
          node scripts/fetch-nginx.js


      # 3. 安装前端依赖
      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install

      # 4. 类型检查（失败即中断，避免带类型错误发版）
      - name: Typecheck Frontend
        run: |
          cd client
          npx vue-tsc --noEmit

      # 5. 构建前端
      - name: Build Frontend
        run: |
          cd client
          npm run build

      # 6. 安装根目录依赖
      - name: Install Root Dependencies
        run: npm install

      # 7. 后端单元测试（用 bash 以保证通配符在 Windows runner 上也能展开）
      - name: Run Server Tests
        shell: bash
        run: node --test server/utils/*.test.js server/services/*/*.test.js

      # 7.5 打包前确认内置 nginx 真的存在且可执行（防止静默发出残缺包）
      - name: Verify bundled nginx
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=resources/nginx/darwin/nginx; else BIN=resources/nginx/win32/nginx.exe; fi
          if [ ! -f "$BIN" ]; then echo "内置 nginx 缺失: $BIN"; exit 1; fi
          echo "找到: $BIN"
          "$BIN" -v

      # 8. 执行打包 (关键修复：跳过 Mac 签名)
      - name: Build Electron App
        run: npm run dist
        env:
          APP_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 👇👇👇 核心修复：告诉 Mac 不要尝试寻找证书，制作免签名包
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 9. 上传产物 (升级到 v4)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevDock-${{ matrix.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.yml
            dist_electron/*.blockmap
          if-no-files-found: warn
          retention-days: 5

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_electron_all
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron_all/*.exe
            dist_electron_all/*.dmg
            dist_electron_all/*.zip
            dist_electron_all/*.yml
            dist_electron_all/*.blockmap
          overwrite_files: true
          # 自动生成 Release 说明，或者你可以自己写
          generate_release_notes: true
